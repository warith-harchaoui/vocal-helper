[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-helper"
version = "3.3.2"
description = "Vocal Helper — async producer/consumer pipeline turning a live PCM stream into diarized, transcribed utterances and (optionally) a rolling LLM summary. Stages: Voice Activity Detection → online speaker diarization (Hungarian-style cosine clustering on backend embeddings) → STT (pywhispercpp turbo) → optional analyst (a local model served via Ollama or vLLM, resolved by best-engine-ai-helper from a committed brief)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"},
]
keywords = [
    "voice", "speech", "asr", "diarization", "vad", "whisper",
    "pywhispercpp", "silero", "streaming", "producer-consumer",
    "asyncio", "ollama", "llm", "live",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime contract :
# - PCM frames at 16 kHz mono float32, shape (n_samples,). The same
#   shape produced by ``capture_helper.iter_mic_audio`` and
#   ``podcast_helper.extract_audio_stream``.
# - VAD : Silero v5 ONNX (CPU). Fast, deterministic, ~ 32 ms window.
# - Diarization : online cosine clustering with constrained Hungarian
#   assignment on per-segment speaker embeddings, sliding window over
#   ``window_s`` (default 20 s, the operating point validated at
#   pdbms-canonical N=2089 — see vocal-helper README "Diarization choice").
# - ASR : pywhispercpp turbo (``large-v3-turbo-q5_0`` by default).
# - LLM analyst : local model served via Ollama or vLLM (backend + model
#   resolved by best-engine-ai-helper from a committed brief) with a rolling
#   summary buffer ; everything older than ``recent_window_s`` (default 60 s)
#   gets folded into the summary.
dependencies = [
    # 4.1.0 is the floor because `osh.unzip_folder` arrives there, and the
    # diarization-engine resolver uses it to open the downloaded bundle. Asking
    # for less would install a version that cannot do it, and the failure would
    # land at first use rather than at install.
    "os-helper>=4.1.0,<5",
    # The CLI is the ``vocal-helper`` entry point, not an optional surface, so
    # click cannot be optional either. It used to be an opt-in extra, back when
    # a stdlib-argparse CLI shipped alongside and click was the twin.
    "click>=8.1,<9",
    # best-engine-ai-helper owns the LLM contract: the analyst (llm.py) and EOT
    # (eot.py) stages resolve the committed ``vocal_helper/llm.brief.yaml`` into a
    # machine-specific engine descriptor (via ``beh.ensure``) and route every
    # request through ``beh.llm.chat`` — which speaks to Ollama or vLLM per the
    # descriptor. No hard-coded model tag lives here. Light deps
    # (click/psutil/pyyaml/requests). Core dep, like os-helper, since
    # GemmaAnalystStage is imported unconditionally.
    "best-engine-ai-helper>=1.0.0,<2",
    "audio-helper>=2.0.0,<3",
    "numpy>=1.24",
    "scipy>=1.15",
    "silero-vad>=5.1",
    # >=1.5 ships prebuilt wheels for macOS arm64, Linux x86_64/aarch64
    # (manylinux + musllinux) and Windows across cp39–cp314, so a plain
    # ``pip install`` needs no C/C++ toolchain on any common platform.
    "pywhispercpp>=1.5",
    # A DIARIZER IS CORE, not an extra. This library's job is "transcription and
    # diarization of speech"; shipping the transcriber by default and leaving the
    # diarizer to an extra meant a bare install could not do half of what the
    # package is for — and both stage defaults pointed at extras, so a bare install
    # did not degrade, it raised.
    #
    # sherpa-onnx is the one that belongs here: torch-free, ONNX, a light wheel on
    # every platform, no HuggingFace, and measured at a diarization error rate of
    # 0.174 (ADR 0002) with French and English both validated. pyannote.audio is
    # better (0.122) and stays an EXTRA because it pulls PyTorch: a 30 % relative
    # quality gain is worth asking for deliberately, not worth imposing half a
    # gigabyte on everyone who installs this to read one meeting.
    "sherpa-onnx>=1.13",
    # And onnxruntime, by exactly the same argument one paragraph up. Since the
    # measurement campaign of 2026-11 the DEFAULT free local diarizer, offline and
    # live both, is Nemotron through its ONNX graph: diarization error 0.090 in
    # both modes against sherpa's 0.174, with zero speaker confusion and the right
    # speaker count. A default engine whose runtime is optional is not a default;
    # it is a crash waiting for the first user who did not read the extras.
    #
    # It is also light and torch-free — the reason this engine was chosen — so it
    # costs a bare install far less than the quality it brings.
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
# Live microphone input depends on capture-helper's per-OS ffmpeg path.
mic = [
    "capture-helper>=1.0.0,<2",
]
# URL source — YouTube / Vimeo / Twitch / podcast RSS / direct audio.
# podcast-helper brings the yt-dlp + ffmpeg streaming chain that feeds
# sources.from_url ; matches the same PcmFrame shape vocal-helper expects.
stream = [
    "podcast-helper>=1.0.0,<2",
]
# THE QUALITY UPGRADE, and the reason it is opt-in. pyannote.audio is the measured
# best offline diarizer here (error rate 0.122 against sherpa's 0.174, a 30 % relative
# gain) and it pulls PyTorch, roughly half a gigabyte. Asking for it deliberately is
# the right trade; imposing it on every install is not. With it present, the stages'
# ``backend="auto"`` picks it on its own — no code change, the install is the switch.
pyannote = [
    "pyannote.audio>=3.3",
]
# NeMo Sortformer backend (Apple-Silicon-friendly; heavy install).
nemo = [
    "torch>=2.5,<3",
    "torchaudio>=2.5,<3",
    "nemo-toolkit[asr]>=2.0",
]
# Kept as a NO-OP so `vocal-helper[sherpa]` still resolves: sherpa-onnx became a core
# dependency, because a library for diarization that cannot diarize out of the box is
# not finished. Nothing to install here any more.
sherpa = []
# The two PAID modes: hosted transcription (Gladia, or ElevenLabs Scribe) and hosted
# diarization (pyannoteAI), offline and live. Its OWN extra, because it is opt-in, it
# is billed, and the local path must never pull a network client it does not use.
#
# `wallet-helper` is what makes a billed call payable only once: it memoises on the
# audio's bytes, across processes and restarts, so a rebuild costs nothing. It is not
# optional within this extra — without it, re-running the same recording re-bills it.
#
# The live half speaks raw WebSocket to both providers: neither live endpoint has a
# Python software development kit, which is why `websockets` is here and no vendor
# client is.
cloud = [
    "requests>=2.31",
    "websockets>=13",
    "pyannoteai>=0.3",
    "wallet-helper>=0.3.0",
]
# Local LLM analyst + semantic-EOT classifier. The serving backend (Ollama or
# vLLM) and the model are resolved by best-engine-ai-helper from the committed
# ``vocal_helper/llm.brief.yaml``, and requests go over HTTP via ``beh.llm.chat``
# — so no client library (no ``ollama`` package) is needed here; best-engine is
# already a core dependency and is listed again for intent.
llm = [
    "best-engine-ai-helper>=1.0.0,<2",
]
# Benchmark / ablation scripts under ``studies/`` (excluded from the wheel) call
# the Ollama Python client — and, on a GPU box, vLLM — directly to compare raw
# engines. Not needed to run vocal-helper itself; install only to reproduce the
# study sweeps. vLLM is intentionally omitted (GPU/platform-specific, guarded by
# a try/except in the scripts).
studies = [
    "ollama>=0.4",
]
# FastAPI HTTP surface at ``vocal_helper.api:app``. python-multipart is
# required for the ``UploadFile`` fields on POST /transcribe and /pipeline.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
# MCP surface via fastapi-mcp — mounts the FastAPI app as MCP tools so any
# MCP-aware host can call ``transcribe`` / ``pipeline`` locally.
mcp = [
    "fastapi-mcp>=0.3",
]
# Independent language-ID cross-check (SpeechBrain VoxLingua107) used by
# vocal_helper.lid.cross_check_regions — a second audio classifier that
# shares nothing with whisper but the signal.
lid = [
    "speechbrain>=1.0",
    "torchaudio>=2.0",
]
# Convenience meta-extra : everything. Includes ``nemo`` since the
# 2026-06-30 study made TitaNet the default online-diar embedding
# (76 % wider separability margin vs pyannote/embedding). Skip it
# explicitly if the ~ 5 GB NeMo install footprint is prohibitive :
#   pip install 'vocal-helper[api,mcp,mic,stream,pyannote,sherpa,llm]'
# then pass ``backend="pyannote"`` (or the torch-free ``"sherpa"``) to
# ``OnlineDiarStage`` / ``OfflineDiarStage``.
all = [
    # `cloud` is included: installing an HTTP client bills nobody. Opt-in is enforced
    # by the ABSENCE OF A KEY, not by the absence of a dependency — see
    # vocal_helper.credentials. A matrix with one corner missing from `all` would be a
    # worse promise than one that is installable and switched off.
    "vocal-helper[api,mcp,mic,stream,pyannote,nemo,sherpa,llm,lid,cloud]",
]
# Word-error metrics (``vocal_helper.bench``): WER / MER / WIL / CER and cpWER
# all come from jiwer. An evaluation surface, not something a transcription run
# needs — hence an extra. It used to be neither an extra nor a dependency, just
# a bare ``import jiwer`` inside a public function.
bench = [
    "jiwer>=3",
]
dev = [
    "pytest>=8", "pytest-timeout>=2.3",
    # The fan-out and strict-pipeline tests are `async def` carrying
    # @pytest.mark.asyncio. Without this plugin pytest does not skip them, it
    # FAILS them — eleven red tests in CI for a missing line here.
    "pytest-asyncio>=0.23",
    # click is a core dependency now (the CLI is not optional), so it is not
    # re-listed here.
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # tests/test_bench.py asserts real WER figures rather than skipping.
    "jiwer>=3",
]

[project.urls]
Homepage = "https://github.com/warith-harchaoui/vocal-helper"
Documentation = "https://github.com/warith-harchaoui/vocal-helper#readme"
Repository = "https://github.com/warith-harchaoui/vocal-helper"
Issues = "https://github.com/warith-harchaoui/vocal-helper/issues"
Changelog = "https://github.com/warith-harchaoui/vocal-helper/blob/main/CHANGELOG.md"
"Deployment guide" = "https://github.com/warith-harchaoui/vocal-helper/blob/main/TECHNICAL_STACK.md"
"Study log" = "https://github.com/warith-harchaoui/vocal-helper/tree/main/studies"

[project.scripts]
vocal-helper = "vocal_helper.cli:main"
vocal-helper-mcp = "vocal_helper.mcp:main"

[tool.setuptools.packages.find]
include = ["vocal_helper*"]
exclude = ["tests*", "assets*", "examples*", "studies*", "doc*"]

# PEP 561 — expose the py.typed marker so mypy / pyright pick up our
# inline type hints for downstream consumers.
[tool.setuptools.package-data]
# The GUI's localization catalogue travels with the package: living
# inside vocal_helper/ is necessary, declaring it here is what ships it.
"vocal_helper" = ["py.typed", "locales/*/LC_MESSAGES/*.po", "locales/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that load Whisper / pyannote / NeMo / Ollama models (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["vocal_helper"]
branch = true
omit = [
    # Optional-import modules that need real backend installs to hit :
    # torch (eot_bench), asyncio-heavy demo (parallel_pipelines).
    # Excluded from the CI floor until they get dedicated integration tests.
    "vocal_helper/eot.py",
    "vocal_helper/eot_bench.py",
    "vocal_helper/parallel_pipelines.py",
    # Auto-generated / trivial re-exports.
    "vocal_helper/__init__.py",
]

[tool.coverage.report]
# Fail the CI if headline coverage on the core surface drops below
# this floor. Set deliberately below the current headline (~ 64 %
# after the error-path / robustness test pass, with model-loading
# paths omitted) so an unrelated PR doesn't red-line the pipeline
# while still catching a large regression — e.g. a PR that quietly
# deletes half the suite. Bump again in a standalone change as the
# ML-backed stages get their own integration harnesses.
fail_under = 55
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # Model-loading paths behind lazy imports — the ImportError arm
    # is only hit when the optional extra is missing, and the
    # ``load()`` bodies require the heavy backend, so they live under
    # the ``integration`` marker rather than the default suite.
    "except ImportError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# ``studies/`` used to sit here, excused as "one-off research scripts". It is in
# fact the repo's measurement culture, and the lint earns its keep there : it
# found a ``zip()`` without ``strict=`` pairing refined labels against their
# segments, which truncates silently on a length mismatch — exactly the kind of
# defect that quietly falsifies a published number.
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM108",
]
