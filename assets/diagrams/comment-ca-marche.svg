<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1551 432" width="1551" height="432" role="img" aria-labelledby="voh-title voh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="voh-title">Comment vocal-helper fonctionne : un flux audio en direct en entrée, des tours de parole attribués et transcrits en sortie</title>
  <desc id="voh-desc">Une plaque de gauche à droite. Entrée : un flux PCM en direct, ou un fichier enregistré joué par le même chemin. Le travail, en quatre étapes numérotées : la détection d'activité vocale trouve où quelqu'un parle vraiment ; la diarisation en ligne regroupe les empreintes de locuteurs par une affectation cosinus de type hongrois, pour qu'un locuteur garde la même étiquette au fil de la conversation ; la reconnaissance transcrit chaque tour avec pywhispercpp turbo ; un résumé glissant optionnel demande à un modèle de langue local ce qui a été dit jusque-là. Sortie : des tours de parole portant qui a parlé, quand, et les mots.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="232" height="78" rx="10"/>
  <text class="n-title" x="144" y="120" text-anchor="middle">un flux audio en direct</text>
  <text class="n-sub" x="144" y="139" text-anchor="middle">PCM, ou un fichier joué dedans</text>
  <path class="flow" d="M266 126 H282" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="286" y="54" width="961" height="144" rx="12"/>
  <text class="panel-label" x="306" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="306" y="94" width="211" height="78" rx="10"/>
  <text class="n-title" x="412" y="127" text-anchor="middle">activité vocale</text>
  <text class="n-sub" x="412" y="146" text-anchor="middle">où quelqu'un parle vraiment</text>
  <text class="step" x="317" y="110">1</text>
  <path class="flow" d="M521 133 H537" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="543" y="94" width="263" height="78" rx="10"/>
  <text class="n-title" x="674" y="127" text-anchor="middle">diariser, en ligne</text>
  <text class="n-sub" x="674" y="146" text-anchor="middle">regroupement cosinus sur empreintes</text>
  <text class="step" x="554" y="110">2</text>
  <path class="flow" d="M810 133 H826" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="832" y="94" width="170" height="78" rx="10"/>
  <text class="n-title" x="917" y="127" text-anchor="middle">transcrire</text>
  <text class="n-sub" x="917" y="146" text-anchor="middle">pywhispercpp turbo</text>
  <text class="step" x="843" y="110">3</text>
  <path class="flow" d="M1006 133 H1022" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="1028" y="94" width="200" height="78" rx="10"/>
  <text class="n-title" x="1128" y="127" text-anchor="middle">résumer (optionnel)</text>
  <text class="n-sub" x="1128" y="146" text-anchor="middle">un LLM local, en glissant</text>
  <text class="step" x="1039" y="110">4</text>
  <path class="flow" d="M1254 126 H1270" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1274" y="40">SORTIE</text>
  <rect class="io" x="1274" y="87" width="250" height="78" rx="10"/>
  <text class="n-title" x="1398" y="120" text-anchor="middle">tours de parole attribués</text>
  <text class="n-sub" x="1398" y="139" text-anchor="middle">qui a parlé, quand, les mots</text>
  <rect class="core" x="566" y="232" width="420" height="54" rx="10"/>
  <text class="on-dark" x="776" y="253" text-anchor="middle">une bibliothèque, appelée pareil partout</text>
  <text class="on-dark-sub" x="776" y="272" text-anchor="middle">os-helper dessous pour la journalisation et les fichiers</text>
  <path class="tie" d="M776 286 V314 H512 V332"/>
  <path class="tie" d="M776 314 H1040 V332"/>
  <path class="tie" d="M512 314 V332"/>
  <rect class="surface" x="437" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="512" y="360" text-anchor="middle">API Python</text>
  <path class="tie" d="M688 314 V332"/>
  <rect class="surface" x="613" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="688" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M864 314 V332"/>
  <rect class="surface" x="789" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="864" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M1040 314 V332"/>
  <rect class="surface" x="965" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="1040" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="776" y="412" text-anchor="middle">Producteur et consommateur tournent de façon asynchrone : une étape lente ne bloque jamais le micro, elle prend du retard puis rattrape.</text>
</svg>
