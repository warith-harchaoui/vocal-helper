# Human-language source of truth for vocal-helper.
#
# `gui:` holds every string the transcript-viewer page shows. Code refers to
# these keys; this file owns the wording. Read by `os_helper.Locales`, the
# loader shared across the suite (CODING.md 21.3).
#
# There is no `prompts:` section here. The optional rolling-summary stage does
# talk to a model, but its prompt is routed through best-engine-ai-helper,
# which keeps its own catalogue: a prompt is a behaviour-bearing asset and
# belongs with the component that owns the behaviour.

meta:
  default_locale: fr
  supported_locales:
  - fr
  - en

gui:
  # --- head / header -------------------------------------------------------
  page_title:
    fr: Vocal Helper — Lecteur de transcription
    en: Vocal Helper — Transcript Viewer
  hero_title:
    fr: Vocal Helper — Lecteur de transcription
    en: Vocal Helper — Transcript Viewer
  hero_subtitle:
    fr: >-
      Déposez un fichier audio ou collez une URL, lancez la transcription
      diarisée en local, puis lisez une transcription colorée par locuteur
      et son résumé glissant.
    en: >-
      Drop an audio file or paste a URL, run diarized transcription locally,
      then read a speaker-labelled, colour-coded transcript and rolling
      summary.
  local_badge:
    fr: Tout en local — votre audio ne quitte jamais cette machine
    en: Runs locally — your audio never leaves this machine

  # --- source: a local file or a URL ---------------------------------------
  source_label:
    fr: Source audio
    en: Audio source
  drop_aria:
    fr: Choisir un fichier audio
    en: Choose an audio file
  drop_hint:
    fr: Déposez un fichier ici ou cliquez pour en choisir un
    en: Drop a file here, or click to choose
  url_label:
    fr: …ou collez une URL
    en: …or paste a URL
  url_label_note:
    fr: (YouTube / flux RSS de podcast / média direct — nécessite l'extra [stream])
    en: (YouTube / podcast RSS / direct media — needs the [stream] extra)
  # Not translated: a URL scheme is the same in every language.
  url_placeholder: https://…

  # --- options -------------------------------------------------------------
  language_label:
    fr: langue
    en: language
  language_note:
    fr: (« auto » la détecte)
    en: ('auto' detects it)
  diar_label:
    fr: moteur de diarisation
    en: diarization backend
  diar_auto:
    fr: auto — le routeur choisit selon la durée
    en: auto — router picks by length
  diar_pyannote:
    fr: pyannote (robuste, longs enregistrements)
    en: pyannote (robust, long)
  diar_nemo:
    fr: nemo (courts, ≤ 4 locuteurs)
    en: nemo (short ≤4-speaker)
  diar_sherpa:
    fr: sherpa (ONNX, sans torch)
    en: sherpa (torch-free ONNX)
  llm_label:
    fr: Ajouter un résumé glissant par LLM local
    en: Add a local LLM rolling summary

  # --- action + results ----------------------------------------------------
  run_button:
    fr: Transcrire en local
    en: Transcribe locally
  summary_heading:
    fr: Résumé glissant
    en: Rolling summary
  legend_aria:
    fr: Locuteurs
    en: Speakers

  # --- language toggle -----------------------------------------------------
  lang_toggle_href:
    fr: /gui?lang=en
    en: /gui?lang=fr
  lang_toggle_flag:
    fr: 🇬🇧
    en: 🇫🇷
  lang_toggle_aria:
    fr: English version
    en: Version française

  # --- strings written by the page's script --------------------------------
  # Templates carry named fields rather than being glued together in
  # JavaScript, so a translator can reorder the sentence (section 21.3.5).
  js_need_source:
    fr: Choisissez d'abord un fichier ou collez une URL.
    en: Pick a file or paste a URL first.
  js_transcribing:
    fr: Transcription en local…
    en: Transcribing locally…
  js_error_prefix:
    fr: 'Erreur '
    en: 'Error '
  js_no_speech:
    fr: (aucune parole détectée — audio vide ou silencieux)
    en: (no speech detected — empty or silent audio)
  js_done:
    fr: Terminé — {count} énoncé(s), traités en local.
    en: Done — {count} utterance(s), processed locally.
  js_request_failed:
    fr: 'Échec de la requête : {error}. Le serveur local tourne-t-il ?'
    en: 'Request failed: {error}. Is the local server running?'
