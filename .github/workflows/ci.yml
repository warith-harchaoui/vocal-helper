name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid stacking redundant runs on rapid pushes / force-pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        # Pinned: an unpinned install let ruff 0.16 make Markdown code-fence
        # formatting the default, silently breaking format-check on doc examples.
        # Bump this deliberately, not by surprise.
        run: pip install "ruff==0.15.21"

      # ``ruff.toml`` exclusions are defined in pyproject.toml — keep the
      # CI invocation aligned with the local ``ruff check .`` developers run.
      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: one Python. The full multi-version sweep runs
        # locally before push; CI stays a fast, fully-blocking check.
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: ffmpeg + ffprobe (pinned static build, not apt)
        run: |
          set -euo pipefail
          # Deliberately not `apt-get install ffmpeg`. That pulls 89 packages and
          # 69 MB from azure.archive.ubuntu.com, and that mirror is the only thing
          # that has ever turned this workflow red: on 2026-10-27 three capped
          # retries spent twelve minutes and then gave up, with nothing wrong in
          # the repository. One tarball off a GitHub release travels the runner's
          # own network and carries both binaries the tests shell out to.
          #
          # The tag is pinned, so the toolchain under the gate only moves when a
          # human moves it; re-pin from github.com/BtbN/FFmpeg-Builds/releases
          # (tag and build name must move together: they name the same commit).
          # The stall detector is the part that matters: --speed-time abandons a
          # transfer that has gone quiet instead of sitting on it until the job
          # timeout, which is precisely how apt failed.
          tag=autobuild-2026-10-26-14-25
          build=ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-shared-8.1
          mkdir -p "$HOME/ffmpeg"
          curl -fsSL --retry 5 --retry-all-errors \
               --speed-limit 100000 --speed-time 30 --max-time 300 \
               "https://github.com/BtbN/FFmpeg-Builds/releases/download/${tag}/${build}.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/ffmpeg" "${build}/bin" "${build}/lib"
          # The binaries carry RUNPATH $ORIGIN/../lib, so putting bin on PATH is the
          # whole of the wiring; no LD_LIBRARY_PATH leaks into the test environment.
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH only reaches later steps, so prove it here by full path.
          "$HOME/ffmpeg/bin/ffmpeg" -version | head -1
          "$HOME/ffmpeg/bin/ffprobe" -version | head -1

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          # The ``integration`` marker is filtered out by pyproject.toml's
          # ``addopts`` — we only install the lightweight deps. Heavy
          # extras (pyannote, nemo, ollama, capture-helper) require auth
          # or model downloads and are exercised manually.
          pip install -e '.[dev]'

      - name: pytest
        run: pytest -v --color=yes

      - name: pytest with coverage
        if: matrix.python-version == '3.12'
        run: |
          pip install pytest-cov
          # [tool.coverage.*] in pyproject.toml sets the source, omit
          # list and fail-under threshold. Bump the floor in a
          # standalone PR, never in the same one that adds coverage.
          pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  pre-commit:
    name: pre-commit (mirror of local hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .pre-commit-config.yaml
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit (commit-time hooks only)
        # Push-stage hooks (pytest + attribution audit) are already
        # covered by the ``test`` and ``attribution-audit`` jobs.
        run: pre-commit run --all-files --show-diff-on-failure

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. No member carries torch in its base
    # dependencies, so this is a cached-wheel install: well under a minute,
    # which is the point.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import vocal_helper"
