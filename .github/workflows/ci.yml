name: CI

# Changes that cannot alter a test outcome do not start a runner: prose, figures,
# and the measured numbers studies/ writes next to its scripts. Every one of them
# still goes through `make preflight` in the pre-push hook, and `ruff` there covers
# the study scripts themselves, which is why *.py under studies/ is NOT ignored.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "assets/**"
      - "studies/**/*.json"
      - "studies/**/*.log"
      - "LICENSE"
      - "CITATION.cff"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "assets/**"
      - "studies/**/*.json"
      - "studies/**/*.log"
      - "LICENSE"
      - "CITATION.cff"
  workflow_dispatch:

# Avoid stacking redundant runs on rapid pushes / force-pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberement legere, et c'est une position : les memes portes tournent dans
# `make preflight` (pose en pre-push par `make install-hooks`, avec la meme
# severite, garde d'environnement comprise) avant qu'un push puisse quitter la machine, donc tout ce
# qui suit a deja passe une fois. La CI confirme, elle ne decouvre pas. Deux
# jobs seulement -- la suite, et la promesse d'installation sur le plancher de
# version -- la ou il y en avait quatre dont deux refaisaient le travail des
# autres.
jobs:
  test:
    name: Lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: one Python. The full multi-version sweep runs
        # locally before push; CI stays a fast, fully-blocking check.
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: ${{ matrix.python-version }}

      # Un venv entier en cache, pas le cache pip : restaurer des roues puis les
      # reinstaller coutait 40 s a chaque run (torch seul en prend 20 a
      # deballer). La cle porte pyproject.toml, ce workflow et la semaine ISO,
      # donc les dependances non epinglees sont re-resolues au moins une fois
      # par semaine, et a chaque changement de l'un ou de l'autre.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: venv
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ steps.week.outputs.week }}-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
      - name: Activer le venv
        run: |
          [ -x "$HOME/venv/bin/python" ] || python -m venv "$HOME/venv"
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: ffmpeg + ffprobe (pinned static build, not apt)
        run: |
          set -euo pipefail
          # Deliberately not `apt-get install ffmpeg`. That pulls 89 packages and
          # 69 MB from azure.archive.ubuntu.com, and that mirror is the only thing
          # that has ever turned this workflow red: on 2026-10-27 three capped
          # retries spent twelve minutes and then gave up, with nothing wrong in
          # the repository. One tarball off a GitHub release travels the runner's
          # own network and carries both binaries the tests shell out to.
          #
          # The tag is pinned, so the toolchain under the gate only moves when a
          # human moves it; re-pin from github.com/BtbN/FFmpeg-Builds/releases
          # (tag and build name must move together: they name the same commit).
          # The stall detector is the part that matters: --speed-time abandons a
          # transfer that has gone quiet instead of sitting on it until the job
          # timeout, which is precisely how apt failed.
          tag=autobuild-2026-10-26-14-25
          build=ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-shared-8.1
          mkdir -p "$HOME/ffmpeg"
          curl -fsSL --retry 5 --retry-all-errors \
               --speed-limit 100000 --speed-time 30 --max-time 300 \
               "https://github.com/BtbN/FFmpeg-Builds/releases/download/${tag}/${build}.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/ffmpeg" "${build}/bin" "${build}/lib"
          # The binaries carry RUNPATH $ORIGIN/../lib, so putting bin on PATH is the
          # whole of the wiring; no LD_LIBRARY_PATH leaks into the test environment.
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH only reaches later steps, so prove it here by full path.
          "$HOME/ffmpeg/bin/ffmpeg" -version | head -1
          "$HOME/ffmpeg/bin/ffprobe" -version | head -1

      # torch arrive par silero-vad. Depuis PyPI, sur Linux, c'est la roue
      # CUDA plus une quinzaine de paquets nvidia-* : 3 Go pour un coureur qui
      # n'a pas de GPU. La roue CPU de l'index PyTorch pese 200 Mo et satisfait
      # la meme contrainte, donc l'installation qui suit la trouve deja la.
      # ruff est epingle : une installation libre a laisse ruff 0.16 changer le
      # format des blocs de code Markdown et casser le format-check en silence.
      - name: Install torch CPU + package + dev extras (venv neuf)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          # The ``integration`` marker is filtered out by pyproject.toml's
          # ``addopts``: only the lightweight deps. Heavy extras (pyannote,
          # nemo, ollama, capture-helper) need auth or model downloads.
          python -m pip install -e '.[dev]' "ruff==0.15.21"

      # Venv restaure : le paquet seul, sans dependances, pour que l'import
      # pointe sur ce checkout et pas sur celui qui a rempli le cache.
      - name: Install package (venv restaure)
        if: steps.venv.outputs.cache-hit == 'true'
        run: python -m pip install --no-deps -e .

      # Les gardes de format vivent ici plutot que dans un job a part : un
      # second coureur, son installation et son cache coutaient une minute
      # pour relancer deux commandes qui durent trois secondes.
      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # UN SEUL passage de la suite. Il y en avait deux -- `pytest` puis
      # `pytest --cov` -- donc six minutes payees deux fois pour la meme
      # verite, la couverture etant le seul ajout du second. Les
      # [tool.coverage.*] de pyproject.toml portent la source, les exclusions
      # et le plancher, donc le seuil reste un garde.
      # pytest-cov vient de l'extra [dev], comme en local : le plugin qui porte
      # le plancher appartient a l'environnement que les deux portes installent.
      - name: pytest (avec couverture)
        run: pytest -q --color=yes --durations=10 --cov --cov-report=term-missing:skip-covered

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. This member does carry torch (through
    # silero-vad), hence the CPU wheel and the cached venv below.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.10"
      # Meme venv en cache que le job du dessus, meme cle hebdomadaire. Sur un
      # venv restaure, `pip install .` verifie encore que chaque dependance
      # declaree est satisfaite sur 3.10 ; la resolution complete depuis zero
      # se rejoue des que la cle change, au plus tard chaque semaine.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: venv
        with:
          path: ~/venv
          key: venv-floor-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ steps.week.outputs.week }}-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
      - name: Activer le venv
        run: |
          [ -x "$HOME/venv/bin/python" ] || python -m venv "$HOME/venv"
          echo "VIRTUAL_ENV=$HOME/venv" >> "$GITHUB_ENV"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      # La roue CPU de torch, pas les 3 Go CUDA de PyPI. pip d'abord : celui
      # qu'embarque un venv 3.10 neuf rejette les metadonnees de l'index
      # PyTorch (typing_extensions contre typing-extensions).
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install .
      - run: python -c "import vocal_helper"
